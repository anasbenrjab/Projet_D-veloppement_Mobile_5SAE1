name: tablego
description: "TableGo - Restaurant discovery and ordering app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local database
  sqflite: ^2.4.1
  path: ^1.9.0

  # Password hashing (PBKDF2-HMAC-SHA256 + constant-time compare)
  cryptography: ^2.7.0

  # File system (app documents directory for photos)
  path_provider: ^2.1.4

  # UUID (photo filenames)
  uuid: ^4.5.1

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Image
  image_picker: ^1.1.2

  # UI
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

  # In-memory SQLite for unit tests (no Android/iOS needed)
  sqflite_common_ffi: ^2.3.4+1

flutter:
  uses-material-design: true
