name: tablego
description: "TableGo — Module 2 : Menu + Commande (Roudaina Saoudi)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1


  # Storage
  shared_preferences: ^2.3.3

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI
  google_fonts: ^6.2.1

  # Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
